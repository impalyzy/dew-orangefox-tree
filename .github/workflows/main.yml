# UNTESTED starter workflow. Run it from the Actions tab; read the log if it fails and tell me the error.
name: Build OrangeFox (dew)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: tree
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
          large-packages: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs aria2 bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
      - name: Sync OrangeFox sources
        run: |
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          git clone https://gitlab.com/OrangeFox/sync.git --depth=1 "$HOME/sync"
          cd "$HOME/sync" && ./orangefox_sync.sh --branch 14.1 --path "$HOME/fox"
      - name: Add device tree
        run: |
          mkdir -p "$HOME/fox/device/xiaomi"
          cp -r "$GITHUB_WORKSPACE/tree" "$HOME/fox/device/xiaomi/dew"
          rm -rf "$HOME/fox/device/xiaomi/dew/.git" "$HOME/fox/device/xiaomi/dew/.github"
      - name: Build
        run: |
          cd "$HOME/fox"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true FOX_BUILD_DEVICE=dew LC_ALL=C
          lunch twrp_dew-eng
          mka adbd vendorbootimage
      - name: Collect output
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$HOME/fox/out/target/product/dew" || exit 0
          cp -v vendor_boot.img ramdisk-recovery.* "$GITHUB_WORKSPACE/out/" || true
          tar -czf "$GITHUB_WORKSPACE/out/recovery_root.tar.gz" recovery/root || true
          cp -v "$HOME/fox/out/error.log" "$GITHUB_WORKSPACE/out/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orangefox-dew
          path: out/*

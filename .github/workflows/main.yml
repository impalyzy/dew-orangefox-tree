# UNTESTED starter workflow. Run it from the Actions tab; read the log if it fails and tell me the error.
name: Build OrangeFox (dew)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: tree
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: false
          large-packages: true
      - name: Add swap (soong is memory hungry)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile || sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs aria2 bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/.bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.bin/repo"
          chmod a+rx "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          repo --version || true
      - name: Sync OrangeFox sources
        run: |
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          git clone https://gitlab.com/OrangeFox/sync.git --depth=1 "$HOME/sync"
          cd "$HOME/sync"
          ok=0
          for i in 1 2 3 4; do
            if ./orangefox_sync.sh --branch 14.1 --path "$HOME/fox"; then ok=1; break; fi
            echo "Sync attempt $i failed (usually a temporary server error), retrying in 60s"
            sleep 60
          done
          df -h / /mnt
          [ "$ok" = 1 ]
      - name: Add device tree
        run: |
          mkdir -p "$HOME/fox/device/xiaomi"
          cp -r "$GITHUB_WORKSPACE/tree" "$HOME/fox/device/xiaomi/dew"
          rm -rf "$HOME/fox/device/xiaomi/dew/.git" "$HOME/fox/device/xiaomi/dew/.github"
      - name: Build
        timeout-minutes: 240
        run: |
          cd "$HOME/fox"
          # progress monitor: prints memory + top processes every 2 minutes
          ( while true; do echo "== $(date +%T) mem/swap"; free -m | sed -n 1,3p; df -h / /mnt | tail -2; ps -eo pid,pcpu,pmem,etime,comm --sort=-pmem | head -4; sleep 120; done ) &
          MON=$!
          trap 'kill $MON 2>/dev/null' EXIT
          # keep Go (soong_build) from ballooning: collect garbage aggressively
          export GOMEMLIMIT=6GiB GOGC=40
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true FOX_BUILD_DEVICE=dew LC_ALL=C
          lunch twrp_dew-ap2a-eng
          if ! mka adbd vendorbootimage; then
            echo "== first build failed; removing a conflicting root/vendor dir and retrying once"
            rm -rf out/target/product/dew/recovery/root/vendor
            mka adbd vendorbootimage
          fi
      - name: Collect output
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$HOME/fox/out/target/product/dew" || exit 0
          cp -v vendor_boot.img ramdisk-recovery.* "$GITHUB_WORKSPACE/out/" || true
          tar -czf "$GITHUB_WORKSPACE/out/recovery_root.tar.gz" recovery/root || true
          cp -v "$HOME/fox/out/error.log" "$GITHUB_WORKSPACE/out/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orangefox-dew
          path: out/*
